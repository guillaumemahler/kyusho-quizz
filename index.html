<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110f">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">

<title>Kyūsho – Quiz</title>
<style>
:root{--bg:#14110f;--card:#1e1916;--card2:#2a221e;--ink:#f3ece4;--mute:#a99c90;--red:#d23a2e;--gold:#d9a441;--ok:#4caf6a;--ko:#e05a50;--line:#3a302a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:520px;margin:0 auto;padding:10px 14px calc(24px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;margin-bottom:6px}
h1{font-size:22px;margin:0;font-weight:700}h1 span{color:var(--red);font-weight:600}
.stats{display:flex;gap:14px;font-size:15px;color:var(--mute)}.stats b{color:var(--ink)}
.icon{background:var(--card2);border:1px solid var(--line);color:var(--ink);width:44px;height:44px;border-radius:12px;font-size:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.tag{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--gold);margin-bottom:8px;font-weight:600}
.prompt{font-size:20px;margin:0 0 6px;line-height:1.3}
.big{font-size:21px;font-weight:600;margin:6px 0 0}
.mute{color:var(--mute);margin:0}.small{font-size:13px}
.kanji,.kj{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP","Noto Serif JP",serif;color:var(--red)}
.kanji{font-size:36px;line-height:1.1}.kj{font-weight:400}
.qhead,.vrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.qhead>div:first-child,.vrow>div:first-child{flex:1;min-width:0}
.vrow{align-items:center}
.njb{display:none;flex:none;background:#fff;border-radius:16px;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.45)}
body.nj-on .njb{display:inline-flex}
.nj{display:block;background-image:var(--nj);background-repeat:no-repeat}
.opts{display:grid;gap:10px;margin-bottom:12px}
.opt{width:100%;text-align:left;font:inherit;font-size:16.5px;padding:15px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card2);color:var(--ink);min-height:54px}
.opt:disabled{color:var(--ink)}
.opt.ok{background:#1d3a26;border-color:var(--ok)}.opt.ko{background:#40201d;border-color:var(--ko)}
.btn{display:block;width:100%;padding:16px;font:inherit;font-size:17px;font-weight:700;border:0;border-radius:14px;background:var(--red);color:#fff;margin-top:10px}
.btn.sec{background:var(--card2);border:1px solid var(--line);color:var(--ink)}
.next{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom));box-shadow:0 8px 24px rgba(0,0,0,.6)}
.link{display:block;margin:18px auto 0;background:none;border:0;color:var(--mute);font:inherit;font-size:13px;text-decoration:underline}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:14px;padding:9px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--card2);color:var(--mute)}
.chip.on{border-color:var(--red);color:var(--ink);background:#3a1f1b}
.prog{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin:12px 0 6px}
.prog div{height:100%;background:linear-gradient(90deg,var(--red),var(--gold))}
.fig{margin:10px 0 4px}
svg.body{width:100%;height:min(46vh,340px);display:block;border-radius:12px;background:radial-gradient(circle at 50% 35%,#2e2621,#171310);touch-action:manipulation}
.cap{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--mute);margin-top:5px}
.sil *{fill:#6e5a4c}.sil .limb{fill:none;stroke:#6e5a4c;stroke-linecap:round;stroke-linejoin:round}
.feat{fill:none;stroke:#3e3129;stroke-width:.7;stroke-linecap:round}.feat .f{fill:#3e3129;stroke:none}
.dot{fill:#ff4a3a;stroke:#fff;stroke-width:.5}.halo{fill:rgba(255,74,58,.28)}
.dot.good{fill:#4fd27a}.halo.good{fill:rgba(79,210,122,.3)}
.cand{fill:rgba(255,255,255,.6);stroke:#000;stroke-opacity:.35;stroke-width:.4}
.pick{fill:none;stroke:#ff5a4f;stroke-width:1}
.reveal.good{border-color:#2f6b42}.reveal.bad{border-color:#7a2e29}
.verdict{font-weight:700;font-size:17px}.reveal.good .verdict{color:var(--ok)}.reveal.bad .verdict{color:var(--ko)}
.why{margin:6px 0 0;font-size:15px}
.rh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.rh0{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rn{font-size:24px;font-weight:700}
.info{margin:10px 0 0;display:grid;gap:8px}
.info dt{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--gold)}
.info dd{margin:1px 0 0;font-size:15px}
.warn{margin-top:12px;font-size:13px;background:#3a2a12;border:1px solid #6b4d1f;color:#f0d29a;border-radius:10px;padding:9px 11px}
details.lx summary{list-style:none;cursor:pointer}details.lx summary::-webkit-details-marker{display:none}
.zt{margin:16px 2px 8px}
</style>
</head>

}

/* ===== Progression ===== */
const KEY="kyusho_quiz_v1";
let S={ok:{},bad:{}};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s)S=Object.assign(S,s)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const valid=(arr,obj)=>{const a=(arr||[]).filter(k=>k in obj);return a.length?a:Object.keys(obj)};
let cfg={modes:new Set(valid(S.modes,MODES)),zones:new Set(valid(S.zones,ZONES))};
let sess={n:0,good:0,streak:0,last:[]};
let cur={};

const $=s=>document.querySelector(s);
const app=$("#app");
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const fam=z=>z==="cou"?"tete":z;
const lc=s=>s.charAt(0).toLowerCase()+s.slice(1);

/* ===== Silhouette ===== */
function dots(p,r,cls=""){
 return p.xy.map(([x,y])=>`<circle class="halo ${cls}" cx="${x}" cy="${y}" r="${r*2}"><animate attributeName="r" values="${r*1.2};${r*3};${r*1.2}" dur="1.6s" repeatCount="indefinite"/></circle><circle class="dot ${cls}" cx="${x}" cy="${y}" r="${r}"/>`).join("");
}
function svg(p,o={}){
 const vb=ZONES[p.z].vb.split(" ").map(Number),W=vb[2],r=W*0.028;
 let marks="";
 if(o.tap){
  cur.W=W;cur.cands=[];
  P.forEach((q,j)=>q.xy.forEach(([x,y])=>{
   if(x>=vb[0]&&x<=vb[0]+vb[2]&&y>=vb[1]&&y<=vb[1]+vb[3]){cur.cands.push({x,y,i:j});marks+=`<circle class="cand" cx="${x}" cy="${y}" r="${r}"/>`}
  }));
 } else marks=dots(p,r);
 return `<div class="fig"><svg class="body" viewBox="${vb.join(" ")}" ${o.tap?'data-tap="1"':""}>${BODY}<g class="marks">${marks}</g></svg>
 <div class="cap"><span>◀ sa droite</span>${p.back&&!o.tap?"<span>↺ derrière / sur le côté</span>":""}<span>sa gauche ▶</span></div></div>`;
}
function info(p){
 const rows=[["Localisation",p.l],["Précision",p.d],["Structure visée",p.s],["Arme du corps",p.a],
  ["École",p.e?`${p.e}<br><span class="mute small">${ECOLES[p.e]}</span>`:""],["Effet recherché",p.f],["Variantes",p.v],["Symbolique",p.y]];
 let h='<dl class="info">'+rows.filter(r=>r[1]).map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join("")+"</dl>";
 if(p.w)h+='<div class="warn">⚠ Tête / cou : pas de percussion au dojo, seulement une pose ou une pression lente et mesurée.</div>';
 return h;
}

/* ===== Quiz ===== */
function distract(i,key){
 const p=P[i],ok=q=>q!==p&&!(p.g&&q.g===p.g)&&q[key]&&q[key]!==p[key];
 const near=shuffle(P.filter(q=>ok(q)&&fam(q.z)===fam(p.z))),far=shuffle(P.filter(q=>ok(q)&&fam(q.z)!==fam(p.z)));
 const out=[];
 for(const q of near.concat(far)){if(!out.includes(q[key]))out.push(q[key]);if(out.length===3)break}
 return out;
}
function wpick(arr){
 const w=arr.map(i=>{const n=P[i].n;return(1+(S.bad[n]||0))/(1+(S.ok[n]||0))});
 let t=w.reduce((a,b)=>a+b,0)*Math.random();
 for(let k=0;k<arr.length;k++){t-=w[k];if(t<=0)return arr[k]}
 return arr[arr.length-1];
}
const compat=(p,m)=>m==="ecole"?!!p.e:true;

function bar(){
 return `<header><button class="icon" id="home">←</button><div class="stats"><span>✓ <b id="sg">${sess.good}</b>/<b id="sn">${sess.n}</b></span><span>🔥 <b id="ss">${sess.streak}</b></span></div></header>`;
}
function nextQ(){
 const pool=P.map((p,i)=>i).filter(i=>cfg.zones.has(P[i].z));
 for(const m of shuffle([...cfg.modes])){
  const c=pool.filter(i=>compat(P[i],m));
  if(!c.length)continue;
  const recent=c.length>6?sess.last:sess.last.slice(-1);
  let c2=c.filter(i=>!recent.includes(i));if(!c2.length)c2=c;
  const i=wpick(c2);
  sess.last.push(i);if(sess.last.length>4)sess.last.shift();
  cur={i,m};return renderQ();
 }
 cur={i:pool[0],m:"nom"};renderQ();
}
function renderQ(){
 const p=P[cur.i],m=cur.m;
 cur.done=false;
 let head="",body="";
 if(m==="loc")head=`<p class="prompt">Où se trouve <b>${p.n}</b> ?</p><div class="kanji">${p.k}</div>`;
 else if(m==="nom")head=`<p class="mute">Quel point se trouve ici ?</p><p class="big">${p.l}</p>`;
 else if(m==="corps"){head=`<p class="prompt">Quel est ce point ?</p>`;body=svg(p)}
 else if(m==="tap"){head=`<p class="prompt">Touche <b>${p.n}</b> <span class="kj">${p.k}</span></p><p class="mute small">Choisis parmi les points blancs.</p>`;body=svg(p,{tap:1})}
 else if(m==="ecole")head=`<p class="prompt">À quelle école ton cours associe <b>${p.n}</b> ?</p><p class="mute">${p.l}</p>`;
 let h=bar()+`<div class="card"><div class="qhead"><div><div class="tag">${MODES[m]}</div>${head}</div>${ninja(pick(NJ_MODE[m]))}</div>${body}</div>`;
 if(m!=="tap"){
  let ans,opts;
  if(m==="loc"){ans=p.l;opts=[ans,...distract(cur.i,"l")]}
  else if(m==="ecole"){ans=p.e;opts=[ans,...shuffle(Object.keys(ECOLES).filter(e=>e!==ans)).slice(0,3)]}
  else{ans=p.n;opts=[ans,...distract(cur.i,"n")]}
  cur.ans=ans;cur.opts=shuffle(opts);
  h+=`<div class="opts">${cur.opts.map((o,k)=>`<button class="opt" data-v="${k}">${o}</button>`).join("")}</div>`;
 }
 h+='<div id="rev"></div>';
 app.innerHTML=h;window.scrollTo(0,0);
 $("#home").onclick=home;
 document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>choose(b));
 if(m==="tap")bindTap();
}
function choose(b){
 if(cur.done)return;cur.done=true;
 const v=cur.opts[+b.dataset.v],ok=v===cur.ans;
 document.querySelectorAll(".opt").forEach(x=>{x.disabled=true;const vv=cur.opts[+x.dataset.v];if(vv===cur.ans)x.classList.add("ok");else if(x===b)x.classList.add("ko")});
 let why="";
 if(!ok){
  if(cur.m==="loc"){const q=P.find(x=>x.l===v);if(q)why=`Cette localisation, c'est <b>${q.n}</b>.`}
  else if(cur.m!=="ecole"){const q=P.find(x=>x.n===v);if(q)why=`<b>${q.n}</b> se trouve : ${lc(q.l)}.`}
 }
 finish(ok,why);
}
function bindTap(){
 const s=document.querySelector("svg[data-tap]");
 s.addEventListener("click",e=>{
  if(cur.done)return;
  const pt=s.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;
  const q=pt.matrixTransform(s.getScreenCTM().inverse());
  let best=null,bd=Infinity;
  cur.cands.forEach(c=>{const d=Math.hypot(c.x-q.x,c.y-q.y);if(d<bd){bd=d;best=c}});
  if(!best||bd>cur.W*0.1)return;
  cur.done=true;
  const ok=best.i===cur.i,p=P[cur.i],r=cur.W*0.028;
  s.querySelector(".marks").insertAdjacentHTML("beforeend",(ok?"":`<circle class="pick" cx="${best.x}" cy="${best.y}" r="${r*1.9}"/>`)+dots(p,r,"good"));
  finish(ok,ok?"":`Tu as touché <b>${P[best.i].n}</b> : ${lc(P[best.i].l)}.`);
 });
}
function finish(ok,why){
 const p=P[cur.i],k=p.n;
 sess.n++;if(ok){sess.good++;sess.streak++}else sess.streak=0;
 S.ok[k]=ok?(S.ok[k]||0)+1:0;
 S.bad[k]=ok?Math.max(0,(S.bad[k]||0)-1):Math.min(4,(S.bad[k]||0)+2);
 save();
 $("#sg").textContent=sess.good;$("#sn").textContent=sess.n;$("#ss").textContent=sess.streak;
 const mastered=ok&&S.ok[k]===3;
 const showFig=!["corps","tap"].includes(cur.m);
 const rev=$("#rev");
 rev.innerHTML=`<div class="card reveal ${ok?"good":"bad"}">
  <div class="vrow"><div><div class="verdict">${ok?"✓ Bonne réponse":"✗ Raté"}${mastered?" · point maîtrisé ⭐":""}</div>${why?`<p class="why">${why}</p>`:""}</div>${ninja(mastered?"medit":ok?"joie":"ko",56)}</div>
  <div class="rh"><div><div class="rn">${p.n}</div>${p.t?`<div class="mute">« ${p.t} »</div>`:""}</div><div class="kanji">${p.k}</div></div>
  ${showFig?svg(p):""}${info(p)}</div>
  <button class="btn next" id="nx">Question suivante →</button>`;
 $("#nx").onclick=nextQ;
 const top=rev.getBoundingClientRect().top-window.innerHeight*0.45;
 if(top>0)window.scrollBy({top,behavior:"smooth"});
}

/* ===== Écrans ===== */
const chip=(k,label,set)=>`<button class="chip ${set.has(k)?"on":""}" data-k="${k}">${label}</button>`;
function bindChips(id,set){
 document.querySelectorAll("#"+id+" .chip").forEach(b=>b.onclick=()=>{
  const k=b.dataset.k;
  if(set.has(k)){if(set.size>1){set.delete(k);b.classList.remove("on")}}else{set.add(k);b.classList.add("on")}
  S.modes=[...cfg.modes];S.zones=[...cfg.zones];save();
 });
}
function home(){
 const m=P.filter(p=>(S.ok[p.n]||0)>=3).length;
 app.innerHTML=`<header><h1>急所 <span>Kyūsho</span></h1>${ninja("saut",56)}</header>
 <div class="card"><p class="mute">Apprends les points vitaux de ton cours : où ils se trouvent, leur nom et leur école. Les points ratés reviennent plus souvent, et la fiche complète s'affiche après chaque réponse.</p>
 <div class="prog"><div style="width:${m/P.length*100}%"></div></div>
 <p class="mute small">${m} / ${P.length} points maîtrisés (3 bonnes réponses d'affilée)</p></div>
 <div class="card"><div class="tag">Types de questions</div><div class="chips" id="cm">${Object.entries(MODES).map(([k,v])=>chip(k,v,cfg.modes)).join("")}</div>
 <div class="tag" style="margin-top:16px">Zones du corps</div><div class="chips" id="cz">${Object.entries(ZONES).map(([k,v])=>chip(k,v.label,cfg.zones)).join("")}</div></div>
 <button class="btn" id="go">Commencer</button>
 <button class="btn sec" id="lx">Lexique des points</button>
 <button class="link" id="rs">Remettre la progression à zéro</button>`;
 bindChips("cm",cfg.modes);bindChips("cz",cfg.zones);
 $("#go").onclick=()=>{sess={n:0,good:0,streak:0,last:[]};nextQ()};
 $("#lx").onclick=lexique;
 $("#rs").onclick=()=>{if(confirm("Effacer toute ta progression ?")){S.ok={};S.bad={};save();home()}};
}
function lexique(){
 let h=`<header><button class="icon" id="home">←</button><h1 style="font-size:19px">Lexique</h1><span style="width:44px"></span></header>`;
 for(const [z,Z] of Object.entries(ZONES)){
  const list=P.filter(p=>p.z===z);if(!list.length)continue;
  h+=`<div class="tag zt">${Z.label}</div>`+list.map(p=>`<details class="card lx"><summary><div class="rh0"><div><b>${p.n}</b> <span class="kj">${p.k}</span><div class="mute small">${p.l}</div></div><span class="mute">${(S.ok[p.n]||0)>=3?"⭐":"›"}</span></div></summary>${svg(p)}${info(p)}</details>`).join("");
 }
 app.innerHTML=h;window.scrollTo(0,0);$("#home").onclick=home;
}
home();
</script>
